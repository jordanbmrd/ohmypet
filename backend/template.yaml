AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OhMyPet backend — AI pet poster generation (OpenAI gpt-image-1 + S3 + DynamoDB)

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  OpenAIImageQuality:
    Type: String
    Default: high
    AllowedValues: [low, medium, high]
    Description: gpt-image-1 quality — "high" looks best, "medium" is ~2x faster/cheaper

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        STAGE: !Ref Stage
        JOBS_TABLE: !Ref JobsTable
        IMAGES_BUCKET: !Ref ImagesBucket
        PRESIGN_EXPIRY_SECONDS: "604800" # 7 days (SigV4 presigned-URL maximum)
    Handler: handler.handler

Resources:
  ##########################################################################
  # HTTP API
  ##########################################################################
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["content-type"]
        AllowMethods: ["GET", "POST", "OPTIONS"]

  ##########################################################################
  # Lambdas
  ##########################################################################
  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/functions/generate
      MemorySize: 512
      # Stays on the request path only long enough to validate + store the input
      # and fire the worker — returns in ~1-2s, well under API Gateway's 30s cap.
      Timeout: 29
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref WorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkerFunction
      Events:
        Generate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /generate
            Method: POST

  # Async worker: runs the slow OpenAI generation off the request path.
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/functions/worker
      MemorySize: 512
      Timeout: 120 # gpt-image-1 (high quality) can take 30-90s
      Environment:
        Variables:
          OPENAI_SECRET_ARN: !Ref OpenAISecret
          OPENAI_IMAGE_QUALITY: !Ref OpenAIImageQuality
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref OpenAISecret

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/functions/status
      MemorySize: 128
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /status/{jobId}
            Method: GET

  ##########################################################################
  # Secrets — OpenAI API key
  ##########################################################################
  # Created empty on purpose: the key value is never stored in source/IaC.
  # After the first deploy, set it with:
  #   aws secretsmanager put-secret-value \
  #     --secret-id ohmypet/openai-api-key-<stage> --secret-string 'sk-...'
  OpenAISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ohmypet/openai-api-key-${Stage}
      Description: OpenAI API key (raw string) for gpt-image-1 image generation

  ##########################################################################
  # DynamoDB — jobs
  ##########################################################################
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ohmypet-jobs-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ##########################################################################
  # S3 — generated images
  ##########################################################################
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Name auto-generated by CloudFormation — avoids S3's name-reuse cooldown
      # after a delete. Everything references the bucket via !Ref, not the name.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInputs
            Prefix: input/
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiBaseUrl:
    Description: Base URL for the OhMyPet API (set this in the iOS Secrets.plist)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ImagesBucketName:
    Value: !Ref ImagesBucket
  JobsTableName:
    Value: !Ref JobsTable
  OpenAISecretId:
    Description: Set the key here after deploy — `aws secretsmanager put-secret-value --secret-id <this> --secret-string 'sk-...'`
    Value: !Sub ohmypet/openai-api-key-${Stage}
